<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoomer</title>
<style>
  :root {
    --bg: #eef3f7; --ink: #14212b; --muted: #55667a; --line: #cfdbe6;
    --accent: #0b5fff; --card: #ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e151c; --ink: #e8eff5; --muted: #92a4b6; --line: #25323f; --accent: #6ea2ff; --card: #151f29; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  header { padding: 18vh 0 28px; transition: padding .3s; }
  body.searched header { padding: 28px 0 16px; }
  .logo { display: inline-block; font-size: clamp(2.6rem, 9vw, 4.2rem); font-weight: 900;
    font-style: italic; letter-spacing: -0.04em; text-decoration: none; position: relative; }
  .logo::before, .logo::after { content: ""; position: absolute; left: -26px; height: 4px;
    background: var(--accent); border-radius: 2px; }
  .logo::before { top: 42%; width: 20px; }
  .logo::after { top: 62%; width: 12px; opacity: .6; }
  body.searched .logo { font-size: 1.9rem; }
  body.searched .logo::before, body.searched .logo::after { display: none; }
  form { display: flex; gap: 10px; margin-top: 18px; }
  input[type=search] { flex: 1; min-width: 0; font: inherit; padding: 14px 18px;
    border: 2px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); }
  input[type=search]:focus, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; font-weight: 700; padding: 0 24px; border: 0; border-radius: 999px;
    background: var(--accent); color: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #0e151c; } }
  main { padding-bottom: 60px; }
  .result { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .result .site { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
  .result h2 { margin: 2px 0 4px; font-size: 1.2rem; line-height: 1.3; }
  .result h2 a { color: var(--accent); text-decoration: none; }
  .result h2 a:hover { text-decoration: underline; }
  .result p { margin: 0; color: var(--muted); max-width: 65ch; }
  .msg { color: var(--muted); padding: 24px 0; }
  .msg.error { color: var(--ink); border-left: 4px solid var(--accent); padding-left: 14px; }
  .pager { display: flex; justify-content: space-between; padding-top: 20px; }
  .pager button { background: var(--card); color: var(--ink); border: 2px solid var(--line); padding: 10px 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/">Zoomer</a>
    <form id="f" role="search">
      <input id="q" type="search" placeholder="Search the web" aria-label="Search the web" autocomplete="off" autofocus>
      <button type="submit">Search</button>
    </form>
  </header>
  <main id="out" aria-live="polite"></main>
</div>
<script>
const f = document.getElementById("f"), q = document.getElementById("q"), out = document.getElementById("out");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function search(term, page) {
  term = term.trim();
  if (!term) return;
  document.body.classList.add("searched");
  document.title = term + " – Zoomer";
  history.replaceState(null, "", "?q=" + encodeURIComponent(term) + (page > 1 ? "&page=" + page : ""));
  out.replaceChildren(el("p", "msg", "Searching…"));
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(term) + "&page=" + page);
    const d = await r.json();
    if (!r.ok) { out.replaceChildren(el("p", "msg error", d.error || "Something went wrong.")); return; }
    if (!d.results.length) { out.replaceChildren(el("p", "msg", "No results for “" + term + "”. Try different words.")); return; }
    const nodes = d.results.map(x => {
      const box = el("article", "result");
      let host = x.url;
      try { host = new URL(x.url).hostname.replace(/^www\./, ""); } catch {}
      const h = el("h2"), a = el("a", "", x.title || x.url);
      a.href = x.url; a.rel = "noopener noreferrer";
      h.append(a);
      box.append(el("div", "site", host), h, el("p", "", x.snippet));
      return box;
    });
    const pager = el("div", "pager");
    const prev = el("button", "", "Previous"), next = el("button", "", "Next");
    prev.type = next.type = "button";
    prev.disabled = page <= 1;
    prev.onclick = () => { search(term, page - 1); scrollTo(0, 0); };
    next.onclick = () => { search(term, page + 1); scrollTo(0, 0); };
    pager.append(prev, next);
    out.replaceChildren(...nodes, pager);
  } catch {
    out.replaceChildren(el("p", "msg error", "Couldn't reach Zoomer's search. Check your connection and try again."));
  }
}

f.addEventListener("submit", e => { e.preventDefault(); search(q.value, 1); });
const p = new URLSearchParams(location.search);
if (p.get("q")) { q.value = p.get("q"); search(q.value, parseInt(p.get("page") || "1", 10) || 1); }
</script>
</body>
</html>
